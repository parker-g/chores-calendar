<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Chores Tracker</title>
</head>
<body>
    <main>
        <header class="app-header">
            <div class="app-title">
                <span class="app-icon" aria-hidden="true">🍽️</span>
                <h1>Chores</h1>
            </div>
            <div class="week-meta">
                <span class="week-badge"></span>
                <span class="week-range"></span>
            </div>
        </header>

        <section class="today-spotlight" aria-live="polite"></section>

        <div class="controls-bar">
            <label class="switch">
                <input type="checkbox" id="lookaheadToggle">
                <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
            <label for="lookaheadToggle" class="controls-label">Look ahead 3 weeks</label>
        </div>

        <section class="weeks-container" id="weeksContainer">
            <div class="week-row" id="currentWeekRow">
                <div class="choresList" id="currentWeekGrid"></div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
